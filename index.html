<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>カメラ検出 学習ツール</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <!-- Viewport: Camera & Canvas Layer -->
        <div class="viewport-container" id="viewport-container">
            <video id="camera-stream" autoplay playsinline muted></video>
            <canvas id="detection-canvas"></canvas>

            <!-- 撮影時のフラッシュ -->
            <div id="capture-flash" class="capture-flash"></div>

            <div id="ui-overlay" class="overlay-ui">
                <div class="top-group">
                    <!-- Top Status Bar -->
                    <div class="top-status-bar">
                        <div class="status-badge">
                            <div id="status-dot" class="status-dot ok"></div>
                            <span id="status-text">起動中…</span>
                        </div>
                        <div class="status-badge memory-badge">
                            <span id="memory-usage">RAM: --</span>
                        </div>
                        <button id="btn-menu" class="icon-btn" aria-label="メニュー" aria-expanded="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                        </button>
                    </div>

                    <!-- Menu: 学習結果のファイル操作・設定 -->
                    <div id="menu-panel" class="menu-panel" hidden>
                        <div class="menu-heading">学習結果</div>
                        <button id="btn-menu-save" class="menu-item">ファイルに保存</button>
                        <button id="btn-menu-load" class="menu-item">ファイルから読込</button>
                        <div class="menu-heading">設定</div>
                        <button id="btn-menu-sound" class="menu-item menu-toggle" aria-pressed="false">
                            効果音<span class="toggle-state">オフ</span>
                        </button>
                        <button id="btn-menu-shadow" class="menu-item menu-toggle" aria-pressed="true">
                            測定で影を除く<span class="toggle-state">オン</span>
                        </button>
                        <input id="file-load" type="file" accept=".json,application/json" hidden>
                    </div>

                    <!-- Measure info (検出モードで測定オンのとき) -->
                    <div id="measure-info" class="train-info" hidden>
                        <div class="train-info-main">
                            <div id="measure-coin" class="train-hint">十円玉を画面に入れてください</div>
                            <div id="measure-summary" class="train-counts"></div>
                        </div>
                    </div>

                    <!-- Training info (学習モードのみ) -->
                    <div id="train-info" class="train-info" hidden>
                        <div class="train-info-main">
                            <div class="train-counts">
                                <span>対象 <b id="count-obj">0</b>枚</span>
                                <span>背景 <b id="count-bg">0</b>枚</span>
                            </div>
                            <div id="train-hint" class="train-hint"></div>
                        </div>
                        <button id="btn-clear-data" class="btn-text danger">全消去</button>
                    </div>
                </div>

                <!-- Training Dashboard -->
                <div id="training-dashboard" class="panel-glass training-panel" style="display: none;">
                    <div class="progress-container">
                        <div id="training-progress-bar" class="progress-bar"></div>
                    </div>
                    <div class="metric-grid">
                        <div class="metric-item">
                            <span class="metric-label">学習Loss</span>
                            <span id="val-train-loss" class="metric-value">0.0000</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">検証Loss</span>
                            <span id="val-val-loss" class="metric-value">0.0000</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">エポック</span>
                            <span id="val-epoch" class="metric-value">0</span>
                        </div>
                    </div>
                    <canvas id="loss-chart-canvas" width="300" height="60"></canvas>
                    <div class="chart-legend">
                        <span class="legend-train">学習</span>
                        <span class="legend-val">検証</span>
                    </div>
                </div>

                <div class="bottom-group">
                    <div id="toast" class="toast" role="status" aria-live="polite"></div>
                    <!-- 枠を描いている間 (映像停止中) の表示 -->
                    <div id="freeze-chip" class="freeze-chip" hidden>静止中</div>

                    <!-- Bottom Control Panel -->
                    <div class="bottom-panel panel-glass">
                        <div class="mode-switch" role="group" aria-label="モード">
                            <button id="btn-mode-detect" class="btn btn-secondary">検出</button>
                            <button id="btn-mode-train" class="btn btn-secondary">学習</button>
                        </div>
                        <div id="detect-actions" class="action-row" hidden>
                            <button id="btn-measure" class="btn btn-secondary measure-toggle" aria-pressed="false">
                                測定<span class="toggle-state">オフ</span>
                            </button>
                            <label class="tol-field" for="input-tol">
                                <span class="tol-label">許容値</span>
                                <input id="input-tol" type="number" inputmode="decimal" step="0.1" min="0.1" value="5.0">
                                <span class="tol-unit">mm</span>
                            </label>
                        </div>
                        <div id="train-actions" class="action-row" hidden>
                            <button id="btn-train-sub" class="btn btn-secondary">背景を撮影</button>
                            <button id="btn-train-main" class="btn btn-primary">学習開始</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TensorFlow.js (v4で追加。オフライン化する場合は tf.min.js を同じフォルダに置き ./tf.min.js に変更) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <!-- Script Loading Order: 依存関係順に読み込み -->
    <script src="./utils.js"></script>
    <script src="./ux-helper.js"></script>
    <script src="./engine.js"></script>
    <script src="./measure.js"></script>
    <script src="./main.js"></script>
</body>
</html>
